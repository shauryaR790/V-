name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-interpreter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo run -- run examples/hello.vpp
      - run: cargo run -- run examples/lesson01_basics.vpp
      - run: cargo run -- check examples/lesson02_functions.vpp
      - run: cargo run -- check examples/lesson03_loops.vpp

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-22 lld-22 llvm-22-dev
          echo "LLVM_SYS_221_PREFIX=$(llvm-config-22 --prefix)" >> "$GITHUB_ENV"
          echo "$(llvm-config-22 --prefix)/bin" >> "$GITHUB_PATH"
          clang-22 --version
          llvm-config-22 --version
      - run: cargo test --features codegen --all-targets -- --test-threads=1
      - run: cargo run --features codegen -- build examples/hello.vpp -o /tmp/hello
      - run: /tmp/hello

  test-lsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --features lsp --bin vppls
