name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-interpreter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo run -- run examples/hello.vpp
      - run: cargo run -- run examples/lesson01_basics.vpp
      - run: cargo run -- check examples/lesson02_functions.vpp
      - run: cargo run -- check examples/lesson03_loops.vpp

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "22"
      - run: cargo test --features codegen --all-targets -- --test-threads=1
      - run: cargo run --features codegen -- build examples/hello.vpp -o /tmp/hello
      - run: /tmp/hello

  test-lsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --features lsp --bin vppls
