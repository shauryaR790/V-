name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-interpreter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo run -- run examples/hello.vpp
      - run: cargo run -- run examples/lesson01_basics.vpp
      - run: cargo run -- check examples/lesson02_functions.vpp
      - run: cargo run -- check examples/lesson03_loops.vpp

  test-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install LLVM 22
        shell: pwsh
        run: |
          curl.exe -L -o llvm.exe "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe"
          Start-Process -FilePath .\llvm.exe -ArgumentList "/S","/D=C:\LLVM" -Wait
          "LLVM_SYS_221_PREFIX=C:\LLVM" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          clang --version
      - name: Native smoke test
        shell: pwsh
        run: |
          cargo build --features codegen --bin vpp
          cargo test --features codegen --test typecheck --test lexer --test parser -- --test-threads=1
          cargo run --features codegen -- run examples/hello.vpp
          cargo run --features codegen -- build examples/hello.vpp -o $env:TEMP\vpp-hello.exe
          & $env:TEMP\vpp-hello.exe

  test-lsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --features lsp --bin vppls
