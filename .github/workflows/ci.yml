name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-interpreter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo run -- run examples/hello.vpp
      - run: cargo run -- run examples/lesson01_basics.vpp
      - run: cargo run -- check examples/lesson02_functions.vpp
      - run: cargo run -- check examples/lesson03_loops.vpp

  test-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install LLVM 22
        shell: pwsh
        run: |
          curl.exe -L -o llvm.exe "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe"
          Start-Process -FilePath .\llvm.exe -ArgumentList "/S","/D=C:\LLVM" -Wait
          "LLVM_SYS_221_PREFIX=C:\LLVM" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & C:\LLVM\bin\clang.exe --version
      - name: Native smoke test
        shell: pwsh
        run: |
          cargo build --features codegen --bin vpp
          cargo test --features codegen --test typecheck --test lexer --test parser -- --test-threads=1
          cargo run --features codegen -- run examples/hello.vpp
          cargo run --features codegen -- build examples/hello.vpp -o $env:TEMP\vpp-hello.exe
          & $env:TEMP\vpp-hello.exe

  test-lsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --features lsp --bin vppls

  compat-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run all examples (interpreter parity)
        run: |
          for f in examples/*.vpp; do
            echo ">> vpp run $f"
            cargo run -- run "$f"
          done
      - name: Type-check lessons
        run: |
          cargo run -- check examples/lesson02_functions.vpp
          cargo run -- check examples/lesson03_loops.vpp
          cargo run -- check examples/arrays_fn.vpp

  test-native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg software-properties-common
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-22 lld-22 llvm-22-dev libclang-22-dev
          echo "LLVM_SYS_221_PREFIX=$(llvm-config-22 --prefix)" >> "$GITHUB_ENV"
          echo "$(llvm-config-22 --prefix)/bin" >> "$GITHUB_PATH"
      - name: Native smoke test
        run: |
          cargo build --release --features codegen,lsp --bin vpp
          cargo run --features codegen -- run examples/hello.vpp
