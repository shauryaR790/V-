name: Publish VS Code extension

# Marketplace publish is manual only (upload VSIX in browser, or run this with VSCE_PAT set).
# Auto-push was failing because GitHub rejects `if: secrets.*` when the secret is missing.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Install extension dependencies
        working-directory: editor/vscode-vpp
        run: npm install

      - name: Publish to Visual Studio Marketplace
        working-directory: editor/vscode-vpp
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Add VSCE_PAT to repo secrets (Settings → Secrets → Actions), or upload the VSIX manually."
            exit 1
          fi
          vsce publish -p "$VSCE_PAT"
