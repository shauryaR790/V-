name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            slug: linux-x64
            vpp_bin: vpp
            vppls_bin: vppls
            llvm_kind: apt
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            slug: windows-x64
            vpp_bin: vpp.exe
            vppls_bin: vppls.exe
            llvm_kind: win-installer
          - os: macos-latest
            target: aarch64-apple-darwin
            slug: macos-arm64
            vpp_bin: vpp
            vppls_bin: vppls
            llvm_kind: macos-tar
            llvm_archive: LLVM-22.1.8-macOS-ARM64.tar.xz
            llvm_dir: LLVM-22.1.8-macOS-ARM64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install LLVM 22 (Linux)
        if: matrix.llvm_kind == 'apt'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-22 lld-22 llvm-22-dev
          echo "LLVM_SYS_221_PREFIX=$(llvm-config-22 --prefix)" >> "$GITHUB_ENV"
          echo "$(llvm-config-22 --prefix)/bin" >> "$GITHUB_PATH"
          clang-22 --version
          llvm-config-22 --version

      - name: Install LLVM 22 (Windows)
        if: matrix.llvm_kind == 'win-installer'
        shell: pwsh
        run: |
          curl.exe -L -o llvm.exe "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe"
          Start-Process -FilePath .\llvm.exe -ArgumentList "/S","/D=C:\LLVM" -Wait
          "LLVM_SYS_221_PREFIX=C:\LLVM" | Out-File -FilePath $env:GITHUB_ENV -Append
          "C:\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install LLVM 22 (macOS)
        if: matrix.llvm_kind == 'macos-tar'
        run: |
          curl -L -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/${{ matrix.llvm_archive }}"
          tar xf llvm.tar.xz
          echo "LLVM_SYS_221_PREFIX=$PWD/${{ matrix.llvm_dir }}" >> "$GITHUB_ENV"
          echo "$PWD/${{ matrix.llvm_dir }}/bin" >> "$GITHUB_PATH"

      - name: Build release
        run: cargo build --release --features codegen,lsp --bin vpp --bin vppls

      - name: Smoke test
        run: cargo test --release --features codegen -- --test-threads=1

      - name: Package bundle (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DIR="vpp-${VERSION}-${{ matrix.slug }}"
          mkdir -p "$DIR/examples"
          cp "target/release/${{ matrix.vpp_bin }}" "$DIR/"
          cp "target/release/${{ matrix.vppls_bin }}" "$DIR/"
          cp -r std registry runtime "$DIR/"
          cp examples/hello.vpp "$DIR/examples/"
          cp RELEASE.txt run.sh "$DIR/"
          chmod +x "$DIR/run.sh" "$DIR/${{ matrix.vpp_bin }}" "$DIR/${{ matrix.vppls_bin }}"
          tar -czf "${DIR}.tar.gz" "$DIR"

      - name: Package bundle (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          $dir = "vpp-$version-${{ matrix.slug }}"
          New-Item -ItemType Directory -Force -Path "$dir/examples" | Out-Null
          Copy-Item "target/release/${{ matrix.vpp_bin }}" "$dir/"
          Copy-Item "target/release/${{ matrix.vppls_bin }}" "$dir/"
          Copy-Item -Recurse std, registry, runtime "$dir/"
          Copy-Item examples/hello.vpp "$dir/examples/"
          Copy-Item GO.bat, RELEASE.txt "$dir/"
          Compress-Archive -Path $dir -DestinationPath "$dir.zip" -Force

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: vpp-${{ matrix.slug }}
          path: |
            vpp-*-${{ matrix.slug }}.zip
            vpp-*-${{ matrix.slug }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} . \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vpp-*-windows-x64.zip
            vpp-*-linux-x64.tar.gz
            vpp-*-macos-arm64.tar.gz
          generate_release_notes: true
