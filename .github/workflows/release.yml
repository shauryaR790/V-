name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: vpp
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: vpp.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: vpp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install LLVM (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Install LLVM (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install llvm --version=22.1.8 -y

      - name: Install LLVM (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install llvm@22

      - name: Set LLVM env (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> $GITHUB_ENV

      - name: Set LLVM env (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "LLVM_SYS_221_PREFIX=/c/Program Files/LLVM" >> $GITHUB_ENV

      - name: Set LLVM env (macOS)
        if: matrix.os == 'macos-latest'
        run: echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> $GITHUB_ENV

      - name: Build release
        run: cargo build --release --features codegen,lsp --bin vpp --bin vppls

      - name: Smoke test
        run: |
          cargo test --release --features codegen -- --test-threads=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpp-${{ matrix.target }}
          path: |
            target/release/vpp
            target/release/vpp.exe
            target/release/vppls
            target/release/vppls.exe
            runtime/vpp_runtime.c
            std/
            registry/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
